version: v2beta1
name: tak-integration

images:
  takrmapi:
    image: ghcr.io/pvarki/tak-integration
    dockerfile: ./Dockerfile
    context: ./
    target: integ_devel_shell
    skipPush: true
    buildKit: {}

pipelines:
  dev: |-
    build_images --all
    start_dev --all

dev:
  takrmapi:
    labelSelector:
      app: tak-server
    namespace: app-tak
    container: takrmapi
    devImage: ${runtime.images.takrmapi}
    command:
      - /bin/bash
      - -lc
      - source /container-init.sh && uv sync --frozen && mkdir -p /ui_files/tak && cp -r /ui_build/* /ui_files/tak/ && (pnpm --dir /app/ui build --outDir /ui_files/tak --watch &) && uv run uvicorn --host 0.0.0.0 --port 8003 --log-level debug --factory takrmapi.app:get_app --reload
    sync:
      - path: ./src:/app/src
      - path: ./docker:/app/docker
        excludePaths:
          - container-init.sh
        # UI sources
      - path: ./ui/src:/app/ui/src
      - path: ./ui/public:/app/ui/public
      - path: ./ui/index.html:/app/ui/index.html
    logs: {}
